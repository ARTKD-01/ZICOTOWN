<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

</head>
<body>
  <header class="site-header">
    <a class="brand" href="inbex.html"><span class="brand-logo" aria-hidden="true"></span><span>ZICO TOWN</span></a>
    <button class="menu-toggle" type="button" aria-controls="site-navigation" aria-expanded="false" aria-label="เปิดเมนู">
      <span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span>
    </button>
    <nav id="site-navigation" class="top-nav" aria-label="หมวดหมู่กฎ">
      <a class="nav-link" href="inbex.html">หน้าหลัก</a>
      <a class="nav-link" href="roleplay.html">กฎโรลเพลย์</a>
      <a class="nav-link" href="city.html">กฎเมือง</a>
      <a class="nav-link" href="activities.html">กฎกิจกรรม</a>
      <a class="nav-link" href="agencies.html">กฎพื้นฐานหน่วยงาน</a>
      <a class="nav-link" href="blackwork.html">กฎทำงานดำ</a>
      <a class="nav-link" href="council.html">กฎพื้นฐานสภา</a>
      <a class="nav-link discord-link" href="https://discord.gg/wDNK643XU" target="_blank" rel="noopener">ติดต่อ Discord</a>
    </nav>
  </header>

  <main class="card">
    <p class="eyebrow">WELCOME TO</p>
    <h1>ZICO TOWN</h1>
    <div class="line"></div>
    <h2>กฎเซิร์ฟเวอร์</h2>
    <h4>อ่านกฎก่อนเล่นและก่อนสมัครหน่วยงานนะครับ</h4>
    </nav>
  </main>
  <div class="music-player" aria-label="เครื่องเล่นเพลง">
    <span class="music-icon" aria-hidden="true">♫</span>
    <audio id="bg-music" controls loop autoplay preload="auto">
      <source src="music.mp3" type="audio/mpeg">
      เบราว์เซอร์นี้ไม่รองรับการเล่นเสียง
    </audio>
    <label class="volume-control" title="ปรับเสียงเพลง">
      <span aria-hidden="true">🔊</span>
      <input class="volume-slider" type="range" min="0" max="1" step="0.01" value="0.5" aria-label="ระดับเสียง">
    </label>
  </div>
  <script>
    const music = document.getElementById('bg-music');
    const volume = document.querySelector('.volume-slider');
    const savedTime = Number(localStorage.getItem('musicTime') || 0);
    const wasPlaying = localStorage.getItem('musicPlaying') === 'true';
    const savedVolume = Number(localStorage.getItem('musicVolume') || 0.5);
    music.volume = savedVolume;
    volume.value = savedVolume;
    volume.addEventListener('input', () => {
      music.volume = Number(volume.value);
      localStorage.setItem('musicVolume', volume.value);
    });

    music.addEventListener('loadedmetadata', () => {
      if (savedTime > 0 && savedTime < music.duration) music.currentTime = savedTime;
      if (wasPlaying) music.play().catch(() => {});
    });

    music.addEventListener('play', () => localStorage.setItem('musicPlaying', 'true'));
    music.addEventListener('pause', () => localStorage.setItem('musicPlaying', 'false'));
    music.addEventListener('timeupdate', () => localStorage.setItem('musicTime', music.currentTime));
    window.addEventListener('pagehide', () => {
      localStorage.setItem('musicTime', music.currentTime);
      localStorage.setItem('musicPlaying', String(!music.paused));
    });
  </script>
  <script src="menu.js"></script>
</body>
</html>
